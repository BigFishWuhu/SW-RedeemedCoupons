services:
  swcoupon:
    image: ghcr.io/bigfishwuhu/sw-redeemedcoupons:latest
    pull_policy: always
    container_name: swcoupon
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      COUPON_CHECK_ENABLED: ${COUPON_CHECK_ENABLED:-true}
      COUPON_CHECK_HOURS: ${COUPON_CHECK_HOURS:-1}
      REDEEM_DELAY_MS: ${REDEEM_DELAY_MS:-4500-12000}
      ACTION_DELAY_MS: ${ACTION_DELAY_MS:-800-2200}
    volumes:
      - swcoupon-data:/app/data
    shm_size: 1gb

volumes:
  swcoupon-data:
